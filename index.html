<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RootMap is a static, guided Web security and DFIR methodology navigator.">
  <title>RootMap</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to methodology</a>
  <noscript><p class="boot-error">RootMap requires JavaScript to navigate its static methodology content.</p></noscript>
  <div id="svg-sprite-container" style="display: none;"></div>

  <div id="boot-error" class="boot-error" style="display: none;" aria-live="assertive"></div>

  <div class="app-layout" id="app-root">
    <div id="header-region"></div>
    <main class="workspace" id="main-content">
      <aside class="sidebar" id="categories-region"></aside>
      <div class="main-content">
        <section class="tree-view" id="tree-region"></section>
        <section class="detail-view" id="detail-region"></section>
      </div>
    </main>
  </div>

  <div id="live-region" class="visually-hidden" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
