version: "4.2"

categories:
  - { id: information-gathering, title: Information Gathering, order: 1 }
  - { id: configuration, title: Configuration, order: 2 }
  - { id: authentication, title: Authentication, order: 3 }
  - { id: authorization, title: Authorization, order: 4 }
  - { id: sessions, title: Sessions, order: 5 }
  - { id: input-validation, title: Input Validation, order: 6 }
  - { id: business-logic, title: Business Logic, order: 7 }
  - { id: client-side, title: Client-Side, order: 8 }

defaults:
  info: &info
    category: information-gathering
    goal: Build an evidence-based picture of the exposed application and its attack surface.
    why: Reliable reconnaissance prevents later tests from missing hosts, technologies, and entry points.
    checklist:
      - Establish a normal response before changing requests.
      - Collect observable evidence and record how it was obtained.
      - Confirm each discovery with a second signal where practical.
    lookFor:
      - Unexpected hosts, applications, technologies, paths, and information disclosures.
    tools: [curl, nmap, wappalyzer, ffuf]
    resources: [wstg-info]
  config: &config
    category: configuration
    goal: Identify deployment and platform settings that expose unnecessary capability or sensitive data.
    why: Secure application code can still be undermined by unsafe infrastructure and deployment defaults.
    checklist:
      - Record the baseline behavior and configuration evidence.
      - Test only the relevant exposed interface or protocol behavior.
      - Confirm that any weakness is reachable and security-relevant.
    lookFor:
      - Default services, unsafe methods, exposed management surfaces, weak headers, or sensitive files.
    tools: [curl, nmap, burp-suite, ffuf]
    resources: [wstg-config]
  authn: &authn
    category: authentication
    goal: Evaluate whether identity verification resists bypass, guessing, recovery abuse, and unsafe credential handling.
    why: Authentication weaknesses can give an attacker access without a legitimate account secret.
    checklist:
      - Map each authentication and recovery channel.
      - Compare success and failure behavior using controlled accounts.
      - Verify protections consistently across every channel.
    lookFor:
      - Distinguishable failures, missing rate limits, default credentials, bypass paths, or weak recovery controls.
    tools: [burp-suite, curl]
    resources: [wstg-authn]
  authz: &authz
    category: authorization
    goal: Verify that every protected action and object enforces the intended access policy.
    why: A valid session must not grant access to another user’s data or higher-privilege functions.
    checklist:
      - Define at least two users or roles with different permissions.
      - Replay protected requests while changing identity, object, and path inputs.
      - Confirm enforcement on the server, not only in the interface.
    lookFor:
      - Cross-user data access, forced browsing, role escalation, or file access outside the intended scope.
    tools: [burp-suite, curl]
    resources: [wstg-authz]
  sess: &sess
    category: sessions
    goal: Assess how the application creates, transports, rotates, and terminates authenticated sessions.
    why: Weak session controls can allow fixation, theft, replay, or persistence after logout.
    checklist:
      - Trace the complete session lifecycle from login through logout.
      - Inspect tokens and cookie attributes without exposing real secrets in notes.
      - Replay controlled tokens to verify rotation and invalidation behavior.
    lookFor:
      - Predictable or exposed tokens, missing cookie protections, fixation, CSRF, and incomplete invalidation.
    tools: [burp-suite, curl]
    resources: [wstg-sess]
  inpv: &inpv
    category: input-validation
    goal: Determine whether untrusted input reaches an interpreter, browser, query, template, or internal service unsafely.
    why: Input validation failures can alter application behavior and cross trust boundaries.
    checklist:
      - Identify the input, its transformations, and its eventual sink.
      - Use a harmless marker to compare encoded and rejected responses.
      - Confirm behavior with the smallest non-destructive proof.
    lookFor:
      - Reflected markers, parser errors, altered queries, unexpected outbound requests, or execution context changes.
    tools: [burp-suite, curl]
    resources: [wstg-inpv]
  busl: &busl
    category: business-logic
    goal: Test whether application rules still hold when valid operations are reordered, repeated, or manipulated.
    why: Logic flaws arise from workflow assumptions that generic scanners cannot understand.
    checklist:
      - Document the expected states, limits, and transitions.
      - Change one sequence, value, timing, or repetition condition at a time.
      - Compare the result with the intended business rule.
    lookFor:
      - Skipped steps, reusable one-time actions, broken limits, forged requests, or unsafe file handling.
    tools: [burp-suite, curl]
    resources: [wstg-busl]
  clnt: &clnt
    category: client-side
    goal: Assess browser-side behavior that processes untrusted data or crosses origins and browsing contexts.
    why: Client-side trust decisions can expose users even when server responses appear valid.
    checklist:
      - Trace controllable data through browser-side sources and sinks.
      - Test the behavior in the browser and inspect the resulting DOM or request.
      - Confirm origin, framing, messaging, and storage boundaries.
    lookFor:
      - Executable DOM changes, unsafe redirects, permissive origins, framing, message trust, or sensitive browser storage.
    tools: [burp-suite, curl]
    resources: [wstg-clnt]

nodes:
  - <<: *info
    id: web-search-reconnaissance
    wstgId: WSTG-v42-INFO-01
    title: Search-engine reconnaissance
    order: 1
  - <<: *info
    id: web-fingerprint-server
    wstgId: WSTG-v42-INFO-02
    title: Fingerprint web server
    order: 2
  - <<: *info
    id: web-identify-technologies
    wstgId: WSTG-v42-INFO-08
    title: Identify technologies
    order: 3
    goal: Identify technologies, frameworks, libraries, and platforms used by the application.
    checklist:
      - Check HTTP response headers for server and framework information.
      - Analyze HTML source for meta tags, scripts, and comments.
      - Compare passive fingerprints with a controlled active check.
      - Identify content management systems and exposed plugins.
    lookFor:
      - Server software, frameworks, programming languages, CMS products, plugins, analytics tools, CDNs, and third-party services.
    findings:
      - id: graphql-detected
        title: GraphQL detected
        next: [web-graphql-overview]
    nextSteps: [web-enumerate-applications, web-identify-entry-points]
