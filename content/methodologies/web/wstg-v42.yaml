nodes:
  - id: web-search-reconnaissance
    wstgId: WSTG-v42-INFO-01
    title: Search-engine reconnaissance
    category: information-gathering
    order: 1
    goal: Discover exposed endpoints, cached credentials, staging domains, and
      configuration leaks using search dorks and public OSINT indexes.
    why: Passive reconnaissance identifies exposed assets and sensitive information
      without directly alerting intrusion detection systems.
    checklist:
      - Query search engines using site-specific dorks ('site:target.example
        filetype:env OR filetype:conf OR filetype:sql').
      - Search public code hosting repositories for hardcoded API keys, tokens,
        internal URLs, and commit histories.
      - Query Wayback Machine and Common Crawl archives for deprecated
        endpoints, legacy parameters, and old JavaScript bundles.
      - Check Certificate Transparency logs (crt.sh) to discover hidden
        subdomains and internal staging hostnames.
    lookFor:
      - Leaked credentials, exposed '.env' files, staging hostnames, forgotten
        Swagger/OpenAPI specifications, and sensitive comments.
    tools:
      - curl
      - ffuf
    resources:
      - wstg-info
      - seclists-repo
    findings: []
    nextSteps: []
  - id: web-fingerprint-server
    wstgId: WSTG-v42-INFO-02
    title: Fingerprint web server
    category: information-gathering
    order: 2
    goal: Determine the exact web server software, reverse proxy, load balancer, and
      operating system from banners and protocol behaviors.
    why: Knowing precise server versions guides targeted vulnerability assessments
      and exploits for known CVEs.
    checklist:
      - Inspect HTTP response headers ('Server', 'X-Powered-By', 'Via',
        'X-Backend-Server', 'CF-Ray') across diverse HTTP methods.
      - Analyze server error responses (400, 404, 405, 500) for default error
        page signatures and platform details.
      - Run targeted nmap service scans and HTTP enumeration scripts against web
        ports.
      - Test HTTP/1.1 versus HTTP/2 protocol support and header handling quirks.
    lookFor:
      - Exact web server software and versions (Apache, Nginx, IIS, Lighttpd),
        reverse proxy headers, and OS fingerprints.
    tools:
      - curl
      - nmap
      - whatweb
    resources:
      - wstg-info
    findings: []
    nextSteps: []
  - id: web-identify-technologies
    wstgId: WSTG-v42-INFO-08
    title: Identify technologies
    category: information-gathering
    order: 3
    goal: Identify application frameworks, libraries, template engines, content
      management systems, and backend runtimes.
    why: Stack identification focuses downstream testing on relevant attack vectors
      like SSTI, deserialization, or known CMS weaknesses.
    checklist:
      - Inspect HTTP response headers for server and framework information.
      - Analyze HTML source for meta tags, scripts, and comments.
      - Compare passive fingerprints with a controlled active check.
      - Identify content management systems and exposed plugins.
    lookFor:
      - Server software, frameworks, programming languages, CMS products,
        plugins, analytics tools, CDNs, and third-party services.
    tools:
      - wappalyzer
      - whatweb
      - nmap
      - curl
    resources:
      - wstg-info
      - wappalyzer-docs
      - htb-web-challenges
    findings:
      - id: graphql-detected
        title: GraphQL detected
        next:
          - web-graphql-overview
    nextSteps:
      - web-enumerate-applications
      - web-identify-entry-points
  - id: web-enumerate-applications
    wstgId: WSTG-v42-INFO-04
    title: Enumerate applications
    category: information-gathering
    order: 4
    goal: Discover virtual hosts, co-hosted applications, hidden routing paths, and
      reverse proxy forwarding rules mapped to the target IP.
    why: Applications often host multiple virtual hosts or administrative subdomains
      with weaker security controls on the same infrastructure.
    checklist:
      - Perform virtual host and subdomain fuzzing with Gobuster or ffuf using
        wordlists such as 'subdomains-top1million-5000.txt'.
      - Filter responses by HTTP status code, response byte size ('-fs'), and
        word count to isolate valid virtual hosts.
      - Test alternate 'Host' and 'X-Forwarded-Host' header values to reach
        internal routing trees.
      - Review TLS certificates for Subject Alternative Names (SANs) pointing to
        auxiliary virtual hosts.
    lookFor:
      - Distinct internal virtual hosts ('dev.target.htb', 'admin.target.htb',
        'api.target.htb'), staging portals, and alternate application roots.
    tools:
      - ffuf
      - gobuster
      - curl
    resources:
      - wstg-info
      - seclists-repo
    findings: []
    nextSteps: []
  - id: web-identify-entry-points
    wstgId: WSTG-v42-INFO-06
    title: Identify entry points
    category: information-gathering
    order: 5
    goal: Map the complete input surface, including URL parameters, headers, POST
      bodies, REST/JSON APIs, and file upload handlers.
    why: Comprehensive entry point discovery ensures subsequent injection and
      authorization tests cover the entire application surface.
    checklist:
      - Recursively enumerate directories and files with ffuf or feroxbuster
        using 'raft-medium-directories.txt'.
      - Spider and intercept all user workflows through Burp Suite to capture
        full parameter listings and endpoints.
      - Extract hidden form fields, query parameters, and endpoints from
        client-side JavaScript source bundles.
      - Fuzz for unlinked GET/POST parameters using ffuf with parameter
        wordlists ('burp-parameter-names.txt').
    lookFor:
      - Hidden administrative paths, debug parameters ('?debug=1',
        '?admin=true'), REST API endpoints, webhooks, and upload routes.
    tools:
      - ffuf
      - feroxbuster
      - burp-suite
      - curl
    resources:
      - wstg-info
      - seclists-repo
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-map-architecture
    wstgId: WSTG-v42-INFO-10
    title: Map architecture
    category: information-gathering
    order: 6
    goal: Diagram the multi-tier application topology, caching layers, backend
      microservices, databases, and trust boundaries.
    why: Understanding architecture reveals intermediate proxy boundaries and
      informs SSRF, request smuggling, and cache poisoning strategies.
    checklist:
      - Analyze caching headers ('Age', 'X-Cache', 'CF-Cache-Status') and
        response latencies to identify CDNs and caching layers.
      - Observe backend error messages to identify database types (PostgreSQL,
        MySQL, SQLite, MongoDB, MinIO/S3, Redis).
      - Test how intermediate proxies handle malformed requests, duplicate
        headers, and HTTP method variations.
      - Document communication pathways between public reverse proxies and
        internal backend microservices.
    lookFor:
      - Microservice topologies, cloud storage buckets (S3/MinIO), internal
        message queues, Redis/cache layers, and WAF decoupling.
    tools:
      - curl
      - burp-suite
      - nmap
    resources:
      - wstg-info
      - cpts-web-prep
    findings: []
    nextSteps: []
  - id: web-test-network-configuration
    wstgId: WSTG-v42-CONF-01
    title: Test network infrastructure configuration
    category: configuration
    order: 1
    goal: Identify misconfigurations in firewalls, reverse proxies, load balancers,
      and exposed auxiliary management services.
    why: Network infrastructure flaws allow unauthorized access to administrative
      interfaces and unauthenticated backend services.
    checklist:
      - Scan all open TCP/UDP ports with nmap to discover administrative
        services (Redis 6379, MongoDB 27017, Elasticsearch 9200).
      - "Test reverse proxy bypasses using forwarding headers ('X-Forwarded-For:
        127.0.0.1', 'X-Real-IP: 127.0.0.1')."
      - Check for DNS zone transfers ('dig axfr') and dangling DNS CNAME records
        for subdomain takeover.
      - Inspect TLS cipher suites and protocol versions for deprecated protocols
        (SSLv3, TLS 1.0/1.1).
    lookFor:
      - Unauthenticated database or cache ports, internal services bound to
        public interfaces, and permissive proxy forwarding rules.
    tools:
      - nmap
      - curl
      - nikto
    resources:
      - wstg-config
    findings: []
    nextSteps: []
  - id: web-test-platform-configuration
    wstgId: WSTG-v42-CONF-02
    title: Test application platform configuration
    category: configuration
    order: 2
    goal: Detect default framework configurations, debug modes, verbose error stack
      traces, and unhardened platform settings.
    why: Debug consoles and unhandled exceptions expose environment secrets,
      internal paths, and remote code execution vectors.
    checklist:
      - Trigger error responses to detect framework debug modes (Django debug
        page, Flask Werkzeug debugger, Rails web-console).
      - Probe for exposed framework health, metrics, and actuator endpoints
        ('/actuator/env', '/actuator/heapdump', '/metrics').
      - Inspect HTTP response headers for missing security headers (CSP,
        X-Content-Type-Options, X-Frame-Options, Referrer-Policy).
      - Test for accessible server status pages ('/server-status',
        '/server-info', '/nginx_status').
    lookFor:
      - Interactive debug consoles (Werkzeug PIN, Rails console), Spring
        Actuator environment dumps, verbose stack traces, and missing security
        headers.
    tools:
      - curl
      - burp-suite
      - nikto
    resources:
      - wstg-config
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-review-backup-files
    wstgId: WSTG-v42-CONF-04
    title: Review backup and unreferenced files
    category: configuration
    order: 3
    goal: Locate sensitive backup files, editor artifacts, source control
      repositories, and unreferenced legacy scripts on the web root.
    why: Backup files and source repositories disclose application source code,
      database credentials, and hardcoded API keys.
    checklist:
      - Fuzz for common backup extensions ('.bak', '.old', '.orig', '.save',
        '.swp', '~', '.zip', '.tar.gz') on known application paths.
      - Check for exposed Git, SVN, or Mercurial directories ('/.git/',
        '/.git/config', '/.git/HEAD', '/.svn/entries').
      - Probe for environment configuration files ('/.env', '/.env.local',
        '/config.json', '/web.config', '/settings.py.bak').
      - Inspect 'robots.txt', 'sitemap.xml', and '.well-known' directories for
        disallowed or hidden paths.
    lookFor:
      - Downloadable database dumps ('dump.sql'), exposed '.git' repositories,
        API credentials in '.env', and editor swap files.
    tools:
      - ffuf
      - gobuster
      - curl
    resources:
      - wstg-config
      - seclists-repo
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-enumerate-admin-interfaces
    wstgId: WSTG-v42-CONF-05
    title: Enumerate administration interfaces
    category: configuration
    order: 4
    goal: Identify hidden or restricted administrative consoles, management
      dashboards, and backend portals.
    why: Administrative interfaces provide high-privilege application control and
      are high-value targets for authentication attacks.
    checklist:
      - Fuzz for administration paths using targeted wordlists ('/admin',
        '/administrator', '/manager/html', '/cpanel', '/dashboard',
        '/phpmyadmin').
      - "Test IP restriction bypasses on admin paths using spoofed headers
        ('X-Forwarded-For: 127.0.0.1', 'X-Custom-IP-Authorization: 127.0.0.1')."
      - Test path normalization quirks (Nginx alias traversal '/admin..;/',
        Apache path tricks '/admin/', URL-encoded slashes '%2e%2e%2fadmin').
      - Check administration interfaces for exposed default credentials or
        self-registration capabilities.
    lookFor:
      - Exposed CMS admin consoles, Tomcat Web Application Manager, database
        managers (Adminer, phpMyAdmin), and IP-restricted endpoints reachable
        via header spoofing.
    tools:
      - ffuf
      - curl
      - burp-suite
    resources:
      - wstg-config
      - seclists-repo
    findings: []
    nextSteps: []
  - id: web-test-http-methods
    wstgId: WSTG-v42-CONF-06
    title: Test HTTP methods
    category: configuration
    order: 5
    goal: Verify supported HTTP verbs and detect dangerous or unhandled methods like
      PUT, DELETE, TRACE, CONNECT, or WebDAV methods.
    why: Unrestricted HTTP methods can enable arbitrary file uploads, cookie
      disclosure via XST, or authentication bypasses via verb tampering.
    checklist:
      - Send 'OPTIONS' requests across endpoints and inspect 'Allow' and
        'Public' response headers.
      - Test arbitrary file upload via 'PUT /test.txt' and file deletion via
        'DELETE /test.txt'.
      - Test 'TRACE' and 'TRACK' requests to detect Cross-Site Tracing (XST)
        reflecting cookies through proxy headers.
      - "Test HTTP method override headers ('X-HTTP-Method-Override: PUT',
        'X-Method-Override: DELETE', '_method=PUT' query param)."
    lookFor:
      - Enabled 'PUT'/'DELETE' enabling arbitrary file writes, 'TRACE'
        reflecting credentials, WebDAV methods, and auth bypass via method
        tampering.
    tools:
      - curl
      - burp-suite
      - nmap
    resources:
      - wstg-config
    findings: []
    nextSteps: []
  - id: web-test-hsts
    wstgId: WSTG-v42-CONF-07
    title: Test HTTP Strict Transport Security
    category: configuration
    order: 6
    goal: Evaluate the implementation of HSTS to prevent SSL stripping and enforce
      HTTPS-only communication.
    why: Without HSTS, attackers positioned on the local network can downgrade user
      connections from HTTPS to plaintext HTTP.
    checklist:
      - Send HTTPS requests and verify the presence and syntax of the
        'Strict-Transport-Security' header.
      - Verify that the 'max-age' directive is set to at least 31536000 seconds
        (1 year).
      - Check for 'includeSubDomains' and 'preload' directives on root domains.
      - Test plaintext HTTP port 80 to verify immediate and unconditional
        301/308 redirection to HTTPS.
    lookFor:
      - Missing 'Strict-Transport-Security' header, 'max-age=0' (disabled),
        missing 'includeSubDomains', and unencrypted HTTP access without
        redirection.
    tools:
      - curl
    resources:
      - wstg-config
    findings: []
    nextSteps: []
  - id: web-test-credential-transport
    wstgId: WSTG-v42-ATHN-01
    title: Test credential transport
    category: authentication
    order: 1
    goal: Ensure login credentials, reset tokens, API keys, and session secrets are
      transmitted exclusively over encrypted channels.
    why: Cleartext credential transport allows network eavesdroppers to capture
      valid account secrets and session tokens.
    checklist:
      - Verify that login forms and authentication API endpoints submit
        credentials over HTTPS.
      - Inspect form action URLs, AJAX calls, and query parameters to verify
        credentials are not transmitted via GET query strings.
      - Check for credential leakage in HTTP 'Referer' headers when redirecting
        to external domains or CDNs.
      - Verify mixed-content warnings and insecure third-party script includes
        on authentication pages.
    lookFor:
      - Passwords transmitted over plaintext HTTP, credentials in URL query
        parameters logged in server logs, and password transmission to
        third-party domains.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-authn
      - owasp-cheatsheet-auth
    findings: []
    nextSteps: []
  - id: web-test-default-credentials
    wstgId: WSTG-v42-ATHN-02
    title: Test default credentials
    category: authentication
    order: 2
    goal: Identify administrative portals, embedded components, and database
      consoles configured with factory-default or commonly known credentials.
    why: Default credentials provide instant, unauthenticated administrative access
      without requiring complex exploitation.
    checklist:
      - Test standard default credential pairs ('admin:admin', 'admin:password',
        'root:root', 'tomcat:s3cret', 'guest:guest', 'postgres:postgres')
        against discovered login endpoints.
      - Look up vendor-specific documentation and default credentials for
        detected software versions (Jenkins, Grafana, Apache Tomcat, Mirth
        Connect, MinIO).
      - Test default accounts in development frameworks (Django default
        superuser, Spring Boot default security user).
      - Check if default credentials work across secondary interfaces (API, SSH,
        FTP, WebDAV).
    lookFor:
      - Successful authentication with default accounts, unchanged factory
        setups, and blank/weak passwords in internal utilities.
    tools:
      - hydra
      - curl
      - burp-suite
    resources:
      - wstg-authn
      - seclists-repo
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-lockout
    wstgId: WSTG-v42-ATHN-03
    title: Test account lockout
    category: authentication
    order: 3
    goal: Test defense mechanisms against automated online credential brute-forcing,
      password spraying, and account denial-of-service.
    why: Without lockout or rate limiting, attackers can perform automated online
      dictionary attacks to compromise accounts.
    checklist:
      - Submit sequential failed login attempts against a test account to
        observe lockout thresholds and IP rate-limiting behaviors.
      - Test whether IP rate limits can be bypassed using spoofed client IP
        headers ('X-Forwarded-For', 'X-Client-IP', 'X-Real-IP').
      - Test password spraying across multiple usernames (1 password attempt per
        user) to evaluate horizontal brute-force detection.
      - Verify whether account lockout creates a persistent denial-of-service
        vulnerability against legitimate users.
    lookFor:
      - Missing rate limits on login/API endpoints, rate-limit bypass via header
        manipulation or case variation, and lack of CAPTCHA/slowdown mechanisms.
    tools:
      - hydra
      - burp-suite
      - curl
    resources:
      - wstg-authn
      - owasp-cheatsheet-auth
    findings: []
    nextSteps: []
  - id: web-test-authentication-bypass
    wstgId: WSTG-v42-ATHN-04
    title: Test authentication bypass
    category: authentication
    order: 4
    goal: Discover flaws in authentication logic that allow unauthorized access
      without valid credentials.
    why: Authentication bypasses allow attackers to assume any user identity or
      administrative role directly.
    checklist:
      - "Test SQL and NoSQL injection payloads in username and password fields
        ('' OR '1'='1', '{\"$ne\": null}', '{\"$gt\": \"\"}')."
      - "Test PHP type juggling and loose comparisons (sending JSON
        '{\"password\": 0}' or '{\"password\": true}')."
      - Inspect client-side authentication checks where login logic or role
        assignments are evaluated in JavaScript.
      - "Test JWT authentication bypasses: 'none' algorithm, empty signatures,
        signature stripping, and HMAC key confusion with public keys."
      - Test direct access to post-authentication URLs by manipulating cookies,
        referrers, or request headers.
    lookFor:
      - Authentication bypass via SQLi/NoSQLi, JSON type juggling
        vulnerabilities, JWT 'none' algorithm acceptance, and parameter
        tampering in multi-step logins.
    tools:
      - burp-suite
      - jwt-tool
      - curl
    resources:
      - wstg-authn
      - portswigger-jwt
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-password-policy
    wstgId: WSTG-v42-ATHN-07
    title: Test password policy
    category: authentication
    order: 5
    goal: Evaluate the enforcement of password complexity, minimum length, entropy,
      and resistance to common password dictionaries.
    why: Weak password policies allow users to choose predictable passwords easily
      cracked through offline wordlists.
    checklist:
      - Attempt to register or change passwords to single-character, purely
        numeric, or extremely short values.
      - Test acceptance of top weak passwords from wordlists like 'rockyou.txt'
        ('password123', 'admin123').
      - Verify whether passwords can be set equal to the username or email.
      - Inspect password storage hashing mechanisms if leaked or exposed
        (bcrypt, Argon2, PBKDF2 vs weak MD5/SHA1).
    lookFor:
      - Extremely permissive password policies, lack of common-password
        blocklists, client-only policy validation, and vulnerable password
        hashing algorithms.
    tools:
      - burp-suite
      - hashcat
    resources:
      - wstg-authn
      - hashcat-wiki
      - owasp-cheatsheet-password-storage
    findings: []
    nextSteps: []
  - id: web-test-password-reset
    wstgId: WSTG-v42-ATHN-09
    title: Test password change and reset
    category: authentication
    order: 6
    goal: Assess the security of password reset workflows, token entropy,
      expiration, and account recovery channels.
    why: Insecure password recovery allows attackers to hijack arbitrary accounts by
      intercepting or predicting reset tokens.
    checklist:
      - Request password resets for test accounts and analyze the structure,
        randomness, and entropy of generated reset tokens.
      - "Test for Host Header Injection in password reset requests ('Host:
        attacker.com', 'X-Forwarded-Host: attacker.com') to poison password
        reset links."
      - Test whether password reset tokens expire after first use, after a
        reasonable time window, or upon password change.
      - Test parameter pollution and IDOR on password reset endpoints (changing
        target user ID/email in confirmation request).
    lookFor:
      - Predictable or timestamp-based reset tokens, password reset poisoning
        via Host header, unexpired reusable tokens, and lack of old password
        verification on change forms.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-authn
      - portswigger-host-header
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-directory-traversal
    wstgId: WSTG-v42-ATHZ-01
    title: Test directory traversal and file inclusion
    category: authorization
    order: 1
    goal: Verify that file path inputs cannot be manipulated to read arbitrary
      system files (LFI) or include remote files (RFI).
    why: Path traversal vulnerabilities disclose sensitive configuration files,
      source code, and credentials, and can lead to remote code execution.
    checklist:
      - Test path traversal sequences ('../', '..%2f', '%2e%2e%2f', '..%252f',
        '....//') against file download and image viewer parameters.
      - Test null byte injection ('%00') on legacy environments and path
        truncation techniques.
      - Test absolute system paths ('/etc/passwd', '/etc/hosts',
        'C:\Windows\win.ini', '/proc/self/environ',
        '/var/log/apache2/access.log').
      - Test PHP filter wrappers
        ('php://filter/convert.base64-encode/resource=index.php') and data
        wrappers ('data://text/plain;base64,...').
      - Test archive extraction (Zip/Tar Slip) where compressed archives extract
        files outside target directories.
    lookFor:
      - Unauthorized disclosure of system files ('/etc/passwd'), server source
        code via base64 wrappers, log poisoning opportunities for RCE, and
        archive path traversal.
    tools:
      - curl
      - burp-suite
      - ffuf
    resources:
      - wstg-authz
      - portswigger-directory-traversal
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-authorization-bypass
    wstgId: WSTG-v42-ATHZ-02
    title: Test authorization bypass
    category: authorization
    order: 2
    goal: Detect flaws where unauthorized users can perform restricted
      administrative functions or access protected endpoints.
    why: Broken authorization allows low-privilege users or anonymous guests to
      perform high-privilege management actions.
    checklist:
      - Capture high-privilege requests in Burp Suite and replay them with
        low-privilege or unauthenticated session tokens.
      - Test forced browsing directly to restricted URLs and API paths
        ('/admin/users/delete', '/api/v1/system/config').
      - Test path traversal in URL routing ('/user/profile/..;/admin',
        '/admin/..%2fadmin-action').
      - Test HTTP method tampering (substituting 'POST' with 'GET', 'PUT', or
        'HEAD' on restricted routes).
      - Test custom header-based authorization bypasses ('X-Original-URL',
        'X-Rewrite-URL').
    lookFor:
      - Execution of administrative actions with standard user credentials,
        missing server-side authorization checks, and URL routing filter
        bypasses.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-authz
      - portswigger-access-control
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-privilege-escalation
    wstgId: WSTG-v42-ATHZ-03
    title: Test privilege escalation
    category: authorization
    order: 3
    goal: Verify that users cannot escalate their access rights horizontally (to
      other users) or vertically (to administrator roles).
    why: Privilege escalation allows regular users to gain full control over the
      application and access all tenant data.
    checklist:
      - "Test mass assignment in user update and registration requests
        (injecting '\"role\": \"admin\"', '\"isAdmin\": true', '\"group\":
        \"administrators\"')."
      - Test privilege tampering in JWT claims (modifying 'role', 'is_admin',
        'scope' claims with forged or unsigned tokens).
      - Test multi-step workflows where privilege checks are enforced only on
        the initial step but omitted in subsequent confirmation requests.
      - Compare permission matrices between different user roles across all
        application functionalities.
    lookFor:
      - Role elevation via JSON/form parameter mass assignment, unauthorized
        permission upgrades via JWT claim tampering, and inconsistent permission
        enforcement across API versions.
    tools:
      - burp-suite
      - jwt-tool
      - curl
    resources:
      - wstg-authz
      - portswigger-access-control
      - htb-web-challenges
    findings: []
    nextSteps: []
  - id: web-test-idor
    wstgId: WSTG-v42-ATHZ-04
    title: Test insecure direct object references
    category: authorization
    order: 4
    goal: Ensure that direct references to database records, files, accounts, and
      resources enforce strict object-level access controls.
    why: IDOR vulnerabilities allow authenticated users to view, modify, or delete
      resources belonging to other tenants.
    checklist:
      - "Identify direct object identifiers in URLs, query parameters, POST
        bodies, and headers ('/api/documents/1042', '?account_id=55',
        '{\"user_id\": 12}')."
      - Substitute identifiers with those of another user while authenticated
        with a low-privilege test account.
      - Test predictable sequential integer IDs, UUID v1 (timestamp-based), and
        base64-encoded object references.
      - Test IDOR on write and delete actions (PATCH, PUT, DELETE) in addition
        to read actions.
      - "Check GraphQL queries for object-level authorization on nodes (querying
        'user(id: 1)')."
    lookFor:
      - Unauthorized reading, updating, or deleting of other users' sensitive
        records, documents, orders, or private messages.
    tools:
      - burp-suite
      - curl
    resources:
      - wstg-authz
      - portswigger-access-control
      - htb-web-challenges
